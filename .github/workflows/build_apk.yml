name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Detect and Configure Android NDK
        run: |
          echo "Checking pre-installed Android NDK versions on runner..."
          ls -la /usr/local/lib/android/sdk/ndk/ || true
          
          # Clean any stale/partial download intermediates from previous runs or sdkmanager
          rm -rf /usr/local/lib/android/sdk/.downloadIntermediates/ || true
          
          # Detect the latest pre-installed NDK version on the runner
          DETECTED_NDK=$(ls -1 /usr/local/lib/android/sdk/ndk/ 2>/dev/null | grep -E '^[0-9]+' | sort -V | tail -n 1)
          if [ -n "$DETECTED_NDK" ]; then
            echo "Selected pre-installed NDK: $DETECTED_NDK"
            echo "ANDROID_NDK_VERSION=$DETECTED_NDK" >> $GITHUB_ENV
          else
            echo "No pre-installed NDK detected, setting default stable NDK: 27.3.13750724"
            echo "ANDROID_NDK_VERSION=27.3.13750724" >> $GITHUB_ENV
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KisanFresh-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
