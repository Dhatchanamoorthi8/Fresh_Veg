name: Deploy Vegora Admin & Staff Portal to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Web to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd apps/vegora_admin_web
          flutter pub get

      - name: Build Web Application
        run: |
          cd apps/vegora_admin_web
          flutter build web --release --base-href "/"
          # Ensure vercel.json is present in the build output directory
          cp web/vercel.json build/web/vercel.json

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_xCI1i2o8KOEZtkckplKB7vc4' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_7R6fTUlBToQUVOjmyGYcqwDHsd7a' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing or empty! Please go to your GitHub Repo -> Settings -> Secrets and variables -> Actions, and add VERCEL_TOKEN."
            exit 1
          fi

          mkdir -p apps/vegora_admin_web/build/web/.vercel
          cat << EOF > apps/vegora_admin_web/build/web/.vercel/project.json
          {
            "orgId": "$VERCEL_ORG_ID",
            "projectId": "$VERCEL_PROJECT_ID"
          }
          EOF

          cd apps/vegora_admin_web/build/web
          npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes
